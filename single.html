<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Samuel Games Hub — Single File</title>
  <style>
    * { box-sizing: border-box }
    body { margin:0; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Arial; background:#071226; color:#e6eef8 }
    header{padding:16px;background:linear-gradient(90deg,#071226,#052033);border-bottom:1px solid rgba(255,255,255,0.03)}
    h1{margin:0;font-size:20px}
    main{display:flex;height:calc(100vh - 112px)}
    #launcher{width:320px;padding:16px;border-right:1px solid rgba(255,255,255,0.03);background:#02101a;overflow:auto}
    #search{width:100%;padding:8px;margin-bottom:12px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:#071226;color:#fff}
    #game-list{list-style:none;padding:0;margin:0}
    #game-list li{padding:8px;border-radius:6px;margin-bottom:6px;cursor:pointer;background:linear-gradient(90deg, rgba(255,255,255,0.02), transparent)}
    #game-list li:hover{background:linear-gradient(90deg, rgba(255,255,255,0.04), transparent)}
    #game-area{flex:1;padding:12px;display:flex;flex-direction:column}
    #game-header{display:flex;align-items:center;gap:12px}
    #canvas-wrap{margin-top:12px;background:#071226;border-radius:8px;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #game-root{width:100%;height:100%;position:relative}
    canvas{display:block}
    button{padding:8px 10px;border-radius:6px;background:#0ea5a5;color:#052022;border:none;cursor:pointer}
    footer{padding:8px 16px;text-align:center;font-size:12px;color:#9fb0c8}
    .note{color:#9fb0c8;font-size:13px}
  </style>
</head>
<body>
  <header>
    <h1>Samuel Games Hub (Single File)</h1>
    <p class="note">50 mini-games in one single HTML file. Use the launcher on the left to pick a game.</p>
  </header>

  <main>
    <aside id="launcher">
      <input id="search" placeholder="Search games..." />
      <ul id="game-list"></ul>
    </aside>

    <section id="game-area">
      <div id="game-header">
        <h2 id="game-title">Select a game</h2>
        <button id="back-btn" hidden>Back to launcher</button>
      </div>
      <div id="canvas-wrap">
        <div id="game-root"></div>
      </div>
    </section>
  </main>

  <footer>
    <small>Built with love — Samuel Games Hub</small>
  </footer>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

    const games = [
      { id:1, name:'Car Racing 3D (implemented)', type:'3D' },
      { id:2, name:'3D Asteroids (implemented)', type:'3D' },
      { id:3, name:'3D Maze Explorer (implemented)', type:'3D' },
      { id:4, name:'Pong (2D) (implemented)', type:'2D' },
      { id:5, name:'Top-down Racer (2D)', type:'2D' },
      { id:6, name:'City Circuit (Car Racing 3D)', type:'3D' },
      { id:7, name:'Drift Challenge (Car Racing 3D)', type:'3D' }
    ];
    // add placeholders up to 50
    for(let i=8;i<=50;i++) games.push({ id:i, name:`Game ${i} (placeholder)`, type: (i%5===0)?'3D':'2D' });

    const gameListEl = document.getElementById('game-list');
    const gameTitleEl = document.getElementById('game-title');
    const gameRoot = document.getElementById('game-root');
    const backBtn = document.getElementById('back-btn');
    const searchInput = document.getElementById('search');

    let currentCleanup = null;

    function renderList(list){
      gameListEl.innerHTML='';
      for(const g of list){
        const li = document.createElement('li');
        li.textContent = `${g.id}. ${g.name}` + (g.type?` [${g.type}]`: '');
        li.onclick = () => openGame(g);
        gameListEl.appendChild(li);
      }
    }

    function clearCurrent(){
      if(currentCleanup) {
        try{ currentCleanup(); } catch(e){ console.warn('cleanup error', e) }
        currentCleanup = null;
      }
      gameRoot.innerHTML = '';
    }

    function openGame(g){
      clearCurrent();
      gameTitleEl.textContent = g.name;
      backBtn.hidden = false;
      gameListEl.style.display = 'none';
      searchInput.style.display = 'none';

      // dispatch to game implementations
      if (g.id === 1) currentCleanup = mountCarRacing(gameRoot);
      else if (g.id === 2) currentCleanup = mountAsteroids(gameRoot);
      else if (g.id === 3) currentCleanup = mountMaze(gameRoot);
      else if (g.id === 4) currentCleanup = mountPong(gameRoot);
      else if (g.id === 5) currentCleanup = mountTopDownRacer(gameRoot);
      else if (g.id === 6) currentCleanup = mountCityCircuit(gameRoot);
      else if (g.id === 7) currentCleanup = mountDriftChallenge(gameRoot);
      else currentCleanup = mountPlaceholder(gameRoot, g);
    }

    backBtn.addEventListener('click', ()=>{
      clearCurrent();
      gameTitleEl.textContent = 'Select a game';
      backBtn.hidden = true;
      gameListEl.style.display = '';
      searchInput.style.display = '';
    });

    searchInput.addEventListener('input', e=>{
      const q = e.target.value.toLowerCase();
      renderList(games.filter(g=>g.name.toLowerCase().includes(q) || String(g.id)===q));
    });

    renderList(games);

    // ----- Game implementations -----

    // Utility: create a full-size container inside root
    function makeContainer(root){
      const c = document.createElement('div');
      c.style.width = '100%'; c.style.height = '100%'; c.style.position='relative';
      root.appendChild(c);
      return c;
    }

    // Car Racing 3D (simplified) - returns cleanup function
    function mountCarRacing(root){
      const container = makeContainer(root);
      const mountEl = document.createElement('div');
      mountEl.style.width='100%'; mountEl.style.height='100%';
      container.appendChild(mountEl);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      const camera = new THREE.PerspectiveCamera(60, mountEl.clientWidth/mountEl.clientHeight, 0.1, 1000);
      camera.position.set(0,6,10);
      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(mountEl.clientWidth, mountEl.clientHeight);
      mountEl.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff,0x444444,1.0); hemi.position.set(0,20,0); scene.add(hemi);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({ color:0x30475e }));
      ground.rotation.x = -Math.PI/2; scene.add(ground);

      const track = new THREE.Group();
      const trackMat = new THREE.MeshStandardMaterial({ color:0x222831 });
      for(let i=0;i<50;i++){ const b = new THREE.Mesh(new THREE.BoxGeometry(4,0.2,40), trackMat); b.position.set((i%2===0?-6:6), 0.1, -i*22); track.add(b); }
      scene.add(track);

      const car = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,3), new THREE.MeshStandardMaterial({ color:0xff3d00 }));
      car.position.set(0,0.5,4); scene.add(car);

      const camOffset = new THREE.Vector3(0,3.2,8);
      const keys = {}; window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
      function onKeyDown(e){ if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) keys[e.key]=true }
      function onKeyUp(e){ if (e.key in keys) keys[e.key]=false }

      let speed = 0;
      let running = true;

      function onResize(){ renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); camera.aspect = mountEl.clientWidth / mountEl.clientHeight; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', onResize);

      function animate(){ if(!running) return; requestAnimationFrame(animate);
        const forward = keys.ArrowUp || keys.w;
        const back = keys.ArrowDown || keys.s;
        const left = keys.ArrowLeft || keys.a;
        const right = keys.ArrowRight || keys.d;
        if (forward) speed = Math.min(0.6, speed + 0.02); else if (back) speed = Math.max(-0.3, speed - 0.02); else speed *= 0.98;
        if (left) car.rotation.y += 0.03; if (right) car.rotation.y -= 0.03;
        car.position.x += Math.sin(car.rotation.y) * speed; car.position.z -= Math.cos(car.rotation.y) * speed;
        const desiredPos = car.position.clone().add(camOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), car.rotation.y));
        camera.position.lerp(desiredPos, 0.08); camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z);
        renderer.render(scene, camera);
      }
      animate();

      // return cleanup
      return function cleanup(){ running = false; window.removeEventListener('resize', onResize); window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); if(mountEl && mountEl.parentNode) mountEl.parentNode.removeChild(mountEl); }
    }

    // City Circuit - 3D car racing with simple buildings
    function mountCityCircuit(root){
      const container = makeContainer(root);
      const mountEl = document.createElement('div'); mountEl.style.width='100%'; mountEl.style.height='100%'; container.appendChild(mountEl);

      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9ad0ff);
      const camera = new THREE.PerspectiveCamera(60, mountEl.clientWidth/mountEl.clientHeight, 0.1, 1000); camera.position.set(0,8,14);
      const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); mountEl.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.0); light.position.set(10,20,10); scene.add(light);
      const ambient = new THREE.AmbientLight(0x404040); scene.add(ambient);

      // ground and road
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({ color:0x6aa84f })); ground.rotation.x = -Math.PI/2; scene.add(ground);
      const road = new THREE.Mesh(new THREE.BoxGeometry(12,0.1,400), new THREE.MeshStandardMaterial({ color:0x2b2b2b })); road.position.y=0.05; scene.add(road);

      // buildings
      const bmat = new THREE.MeshStandardMaterial({ color:0xb6d0e0 });
      for(let i=-5;i<=5;i+=2){ const h = 2 + Math.random()*6; const b = new THREE.Mesh(new THREE.BoxGeometry(3,h,3), bmat); b.position.set(i*6 + (Math.random()-0.5)*2, h/2, -Math.random()*200 + 20); scene.add(b); }

      // car
      const car = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.6,3), new THREE.MeshStandardMaterial({ color:0x0057ff })); car.position.set(0,0.6,10); scene.add(car);

      const camOffset = new THREE.Vector3(0,4,10);
      const keys = {}; window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
      function onKeyDown(e){ if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) keys[e.key]=true }
      function onKeyUp(e){ if (e.key in keys) keys[e.key]=false }

      let speed = 0; let running = true;
      function onResize(){ renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); camera.aspect = mountEl.clientWidth / mountEl.clientHeight; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', onResize);

      function animate(){ if(!running) return; requestAnimationFrame(animate);
        const forward = keys.ArrowUp || keys.w;
        const back = keys.ArrowDown || keys.s;
        const left = keys.ArrowLeft || keys.a;
        const right = keys.ArrowRight || keys.d;
        if (forward) speed = Math.min(0.9, speed + 0.03); else if (back) speed = Math.max(-0.4, speed - 0.03); else speed *= 0.985;
        if (left) car.rotation.y += 0.04 * (1 + Math.min(0.8, speed));
        if (right) car.rotation.y -= 0.04 * (1 + Math.min(0.8, speed));
        car.position.x += Math.sin(car.rotation.y) * speed; car.position.z -= Math.cos(car.rotation.y) * speed;
        // keep car on road
        car.position.x = Math.max(-5.5, Math.min(5.5, car.position.x));
        // camera follow
        const desired = car.position.clone().add(camOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), car.rotation.y));
        camera.position.lerp(desired, 0.08); camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z);
        renderer.render(scene, camera);
      }
      animate();

      return function cleanup(){ running=false; window.removeEventListener('resize', onResize); window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); if(mountEl && mountEl.parentNode) mountEl.parentNode.removeChild(mountEl); }
    }

    // Drift Challenge - 3D with simple drift feel
    function mountDriftChallenge(root){
      const container = makeContainer(root);
      const mountEl = document.createElement('div'); mountEl.style.width='100%'; mountEl.style.height='100%'; container.appendChild(mountEl);
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87bfff);
      const camera = new THREE.PerspectiveCamera(60, mountEl.clientWidth/mountEl.clientHeight, 0.1, 1000); camera.position.set(0,5,12);
      const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); mountEl.appendChild(renderer.domElement);
      const light = new THREE.HemisphereLight(0xffffff,0x444444,1.0); scene.add(light);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({ color:0x2e3b4e })); ground.rotation.x = -Math.PI/2; scene.add(ground);

      // circular track markers
      const track = new THREE.Group();
      for(let i=0;i<80;i++){ const seg = new THREE.Mesh(new THREE.BoxGeometry(1,0.1,10), new THREE.MeshStandardMaterial({ color: i%2?0xdddddd:0x333333 })); seg.position.set(Math.cos(i/80*Math.PI*2)*20, 0.05, Math.sin(i/80*Math.PI*2)*20); seg.lookAt(0,0,0); track.add(seg); }
      scene.add(track);

      const car = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.5,2.6), new THREE.MeshStandardMaterial({ color:0xff8a00 })); car.position.set(20,0.6,0); scene.add(car);

      const camOffset = new THREE.Vector3(0,3,8);
      const keys = {}; window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
      function onKeyDown(e){ if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) keys[e.key]=true }
      function onKeyUp(e){ if (e.key in keys) keys[e.key]=false }

      let vel = 0; let steer = 0; let running = true;
      function onResize(){ renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); camera.aspect = mountEl.clientWidth / mountEl.clientHeight; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', onResize);

      function animate(){ if(!running) return; requestAnimationFrame(animate);
        const forward = keys.ArrowUp || keys.w;
        const back = keys.ArrowDown || keys.s;
        const left = keys.ArrowLeft || keys.a;
        const right = keys.ArrowRight || keys.d;
        if (forward) vel = Math.min(1.2, vel + 0.03); else if (back) vel = Math.max(-0.6, vel - 0.04); else vel *= 0.985;
        if (left) steer += 0.02; else if (right) steer -= 0.02; else steer *= 0.92;
        // drift effect: higher lateral slide when speed high
        const driftFactor = Math.min(1.2, Math.abs(vel)*0.8);
        car.rotation.y += steer * 0.8;
        car.position.x += Math.sin(car.rotation.y) * vel + Math.cos(car.rotation.y + Math.PI/2) * steer * driftFactor * 0.5;
        car.position.z -= Math.cos(car.rotation.y) * vel + Math.sin(car.rotation.y + Math.PI/2) * steer * driftFactor * 0.5;

        const desired = car.position.clone().add(camOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), car.rotation.y));
        camera.position.lerp(desired, 0.08); camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z);
        renderer.render(scene, camera);
      }
      animate();

      return function cleanup(){ running=false; window.removeEventListener('resize', onResize); window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); if(mountEl && mountEl.parentNode) mountEl.parentNode.removeChild(mountEl); }
    }

    // 3D Asteroids (simpler)
    function mountAsteroids(root){
      const container = makeContainer(root);
      const mountEl = document.createElement('div'); mountEl.style.width='100%'; mountEl.style.height='100%'; container.appendChild(mountEl);
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000814);
      const camera = new THREE.PerspectiveCamera(60, mountEl.clientWidth/mountEl.clientHeight, 0.1, 1000); camera.position.set(0,10,20);
      const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); mountEl.appendChild(renderer.domElement);
      const light = new THREE.DirectionalLight(0xffffff, 1.0); light.position.set(10,20,10); scene.add(light);
      const ship = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0), new THREE.MeshStandardMaterial({ color:0xffd60a })); ship.position.set(0,0,0); scene.add(ship);
      const asteroids = new THREE.Group(); for(let i=0;i<25;i++){ const r = 0.4 + Math.random()*2.0; const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r,0), new THREE.MeshStandardMaterial({ color:0x8b9da6 })); m.position.set((Math.random()-0.5)*60,(Math.random()-0.5)*20,-Math.random()*200); m.userData.velocity = new THREE.Vector3((Math.random()-0.5)*0.1,(Math.random()-0.5)*0.05,0.2+Math.random()*0.8); asteroids.add(m); } scene.add(asteroids);
      const keys = {}; window.addEventListener('keydown', e=> keys[e.key]=true); window.addEventListener('keyup', e=> keys[e.key]=false);
      function onResize(){ renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); camera.aspect = mountEl.clientWidth / mountEl.clientHeight; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', onResize);
      let running = true;
      function animate(){ if(!running) return; requestAnimationFrame(animate);
        if (keys.ArrowLeft || keys.a) ship.position.x -= 0.4; if (keys.ArrowRight || keys.d) ship.position.x += 0.4; if (keys.ArrowUp || keys.w) ship.position.y += 0.3; if (keys.ArrowDown || keys.s) ship.position.y -= 0.3;
        ship.position.x = THREE.MathUtils.clamp(ship.position.x, -30, 30); ship.position.y = THREE.MathUtils.clamp(ship.position.y, -10, 10);
        camera.position.lerp(new THREE.Vector3(ship.position.x, ship.position.y+6, ship.position.z+24), 0.05); camera.lookAt(ship.position);
        asteroids.children.forEach(a=>{ a.position.add(a.userData.velocity); if (a.position.z > 50) a.position.z = -300; });
        renderer.render(scene, camera);
      }
      animate();
      return function cleanup(){ running=false; window.removeEventListener('resize', onResize); window.removeEventListener('keydown', ()=>{}); window.removeEventListener('keyup', ()=>{}); if(mountEl && mountEl.parentNode) mountEl.parentNode.removeChild(mountEl); }
    }

    // 3D Maze Explorer
    function mountMaze(root){
      const container = makeContainer(root);
      const mountEl = document.createElement('div'); mountEl.style.width='100%'; mountEl.style.height='100%'; container.appendChild(mountEl);
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b1220);
      const camera = new THREE.PerspectiveCamera(75, mountEl.clientWidth/mountEl.clientHeight, 0.1, 1000); camera.position.set(0,6,12);
      const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); mountEl.appendChild(renderer.domElement);
      const light = new THREE.HemisphereLight(0xffffff,0x444444,1.2); scene.add(light);
      const maze = []; const size = 11;
      for(let z=0; z<size; z++){ maze[z]=[]; for(let x=0;x<size;x++){ if (x===0||z===0||x===size-1||z===size-1 || (Math.random()>0.75)){ maze[z][x]=1; const wall = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({ color:0x2b2d42 })); wall.position.set((x-size/2),1,(z-size/2)); scene.add(wall); } else maze[z][x]=0; }}
      const player = new THREE.Mesh(new THREE.SphereGeometry(0.4,12,12), new THREE.MeshStandardMaterial({ color:0xff6b6b })); player.position.set(-size/2+1,0.4,-size/2+1); scene.add(player);
      const keys = {}; window.addEventListener('keydown', e=> keys[e.key]=true); window.addEventListener('keyup', e=> keys[e.key]=false);
      function onResize(){ renderer.setSize(mountEl.clientWidth, mountEl.clientHeight); camera.aspect = mountEl.clientWidth / mountEl.clientHeight; camera.updateProjectionMatrix(); }
      window.addEventListener('resize', onResize);
      let running = true;
      function animate(){ if(!running) return; requestAnimationFrame(animate);
        if (keys.w || keys.ArrowUp) player.position.z -= 0.08; if (keys.s || keys.ArrowDown) player.position.z += 0.08; if (keys.a || keys.ArrowLeft) player.position.x -= 0.08; if (keys.d || keys.ArrowRight) player.position.x += 0.08;
        camera.position.lerp(new THREE.Vector3(player.position.x, player.position.y+6, player.position.z+8), 0.08); camera.lookAt(player.position.x, player.position.y, player.position.z);
        renderer.render(scene, camera);
      }
      animate();
      return function cleanup(){ running=false; window.removeEventListener('resize', onResize); window.removeEventListener('keydown', ()=>{}); window.removeEventListener('keyup', ()=>{}); if(mountEl && mountEl.parentNode) mountEl.parentNode.removeChild(mountEl); }
    }

    // Pong 2D
    function mountPong(root){
      const container = makeContainer(root);
      const canvasWrap = document.createElement('div'); canvasWrap.style.padding='12px'; container.appendChild(canvasWrap);
      const c = document.createElement('canvas'); c.width = Math.min(960, window.innerWidth-380); c.height = Math.min(600, window.innerHeight-180); c.style.background='#071226'; c.style.borderRadius='6px'; canvasWrap.appendChild(c);
      const ctx = c.getContext('2d');
      let paddleHeight = 80; let paddleWidth = 12; let leftY = (c.height - paddleHeight)/2; let rightY = leftY; let ball = { x:c.width/2, y:c.height/2, vx:4, vy:3, r:8 };
      let up=false, down=false; function onKeyDown(e){ if (e.key==='w') up=true; if (e.key==='s') down=true } function onKeyUp(e){ if (e.key==='w') up=false; if (e.key==='s') down=false }
      window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
      let running = true;
      function step(){ if(!running) return; requestAnimationFrame(step);
        if (up) leftY -=6; if (down) leftY +=6; leftY = Math.max(0, Math.min(c.height-paddleHeight, leftY)); if (ball.y > rightY + paddleHeight/2) rightY += 4; else rightY -=4;
        ball.x += ball.vx; ball.y += ball.vy; if (ball.y < ball.r || ball.y > c.height - ball.r) ball.vy *= -1;
        if (ball.x - ball.r < paddleWidth && ball.y > leftY && ball.y < leftY + paddleHeight) { ball.vx *= -1; ball.x = paddleWidth + ball.r }
        if (ball.x + ball.r > c.width - paddleWidth && ball.y > rightY && ball.y < rightY + paddleHeight) { ball.vx *= -1; ball.x = c.width - paddleWidth - ball.r }
        if (ball.x < 0 || ball.x > c.width) { ball.x = c.width/2; ball.y = c.height/2; ball.vx = 4*((Math.random()>0.5)?1:-1); ball.vy = 3*((Math.random()>0.5)?1:-1) }
        draw();
      }
      function draw(){ ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle = '#94a3b8'; ctx.fillRect(0,leftY,paddleWidth,paddleHeight); ctx.fillRect(c.width-paddleWidth,rightY,paddleWidth,paddleHeight); ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); }
      step();
      return function cleanup(){ running=false; window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); if(canvasWrap && canvasWrap.parentNode) canvasWrap.parentNode.removeChild(canvasWrap); }
    }

    // Top-down Racer (2D)
    function mountTopDownRacer(root){
      const container = makeContainer(root);
      const canvasWrap = document.createElement('div'); canvasWrap.style.padding='12px'; container.appendChild(canvasWrap);
      const c = document.createElement('canvas'); c.width = Math.min(1000, window.innerWidth-380); c.height = Math.min(700, window.innerHeight-180); c.style.background='#0b1220'; c.style.borderRadius='6px'; canvasWrap.appendChild(c);
      const ctx = c.getContext('2d');
      const track = { x:60, y:60, w:c.width-120, h:c.height-120 };
      const car = { x: c.width/2, y: c.height/2, angle:0, speed:0 };
      const keys = {}; window.addEventListener('keydown', e=> keys[e.key]=true); window.addEventListener('keyup', e=> keys[e.key]=false);
      let running = true;
      function loop(){ if(!running) return; requestAnimationFrame(loop);
        // controls
        if (keys.ArrowUp || keys.w) car.speed = Math.min(6, car.speed + 0.15); else car.speed *= 0.98;
        if (keys.ArrowDown || keys.s) car.speed = Math.max(-2, car.speed - 0.2);
        if (keys.ArrowLeft || keys.a) car.angle -= 0.06 * (1 + Math.abs(car.speed)/6);
        if (keys.ArrowRight || keys.d) car.angle += 0.06 * (1 + Math.abs(car.speed)/6);
        car.x += Math.sin(car.angle) * car.speed; car.y -= Math.cos(car.angle) * car.speed;
        // keep on track
        car.x = Math.max(track.x+10, Math.min(track.x+track.w-10, car.x)); car.y = Math.max(track.y+10, Math.min(track.y+track.h-10, car.y));
        draw();
      }
      function draw(){ ctx.clearRect(0,0,c.width,c.height);
        // track
        ctx.fillStyle = '#0f1724'; ctx.fillRect(track.x, track.y, track.w, track.h);
        // boundaries
        ctx.strokeStyle = '#9fb0c8'; ctx.lineWidth = 4; ctx.strokeRect(track.x, track.y, track.w, track.h);
        // car
        ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.angle);
        ctx.fillStyle = '#ff5050'; ctx.fillRect(-12, -20, 24, 40);
        ctx.fillStyle='#222'; ctx.fillRect(-10, -18, 6, 10); ctx.fillRect(4,-18,6,10);
        ctx.restore();
      }
      loop();
      return function cleanup(){ running=false; window.removeEventListener('keydown', ()=>{}); window.removeEventListener('keyup', ()=>{}); if(canvasWrap && canvasWrap.parentNode) canvasWrap.parentNode.removeChild(canvasWrap); }
    }

    // Placeholder game simple animation and instruction
    function mountPlaceholder(root, g){
      const container = makeContainer(root);
      const el = document.createElement('div'); el.style.padding='24px'; el.innerHTML = `<h3>${g.name}</h3><p class="note">This is a placeholder. Replace with your own game logic.</p><canvas id="phc" width="800" height="450" style="background:#061224;border-radius:6px"></canvas>`;
      container.appendChild(el);
      const c = el.querySelector('canvas'); const ctx = c.getContext('2d'); let x = c.width/2; let vx = (Math.random()>0.5?2:-2); let running=true;
      function loop(){ if(!running) return; requestAnimationFrame(loop); ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle = '#06b6d4'; ctx.beginPath(); ctx.arc(x, c.height/2, 30, 0, Math.PI*2); ctx.fill(); x += vx; if (x < 30 || x > c.width-30) vx *= -1; }
      loop();
      return function cleanup(){ running=false; if(el && el.parentNode) el.parentNode.removeChild(el); }
    }
